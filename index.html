<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event To-Do List</title>
<style>
:root{--bg:#f3f6f4;--card:#ffffff;--ink:#16302b;--mute:#5d726d;--line:#d5e0dc;--brand:#0f5c4d;--gold:#c8922a;--done:#8aa39d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--card:#162622;--ink:#e8f1ee;--mute:#9bb3ad;--line:#2a3f3a;--brand:#3fbfa3;--gold:#e0b04f;--done:#6d8680;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a17;--card:#162622;--ink:#e8f1ee;--mute:#9bb3ad;--line:#2a3f3a;--brand:#3fbfa3;--gold:#e0b04f;--done:#6d8680;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-size:2rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 20px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--brand);transition:width .3s}
.count{display:flex;justify-content:space-between;margin:8px 0 20px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px}
li input{position:absolute;opacity:0;width:0;height:0}
label{display:flex;align-items:center;gap:14px;flex:1;cursor:pointer;min-height:36px}
.box{flex:none;width:30px;height:30px;border:2px solid var(--brand);border-radius:8px;display:grid;place-items:center;color:transparent;font-weight:700;font-size:20px;transition:background .15s}
input:checked+.box{background:var(--brand);color:#fff}
input:focus-visible+.box{outline:3px solid var(--gold);outline-offset:2px}
.txt{flex:1}
li.done .txt{text-decoration:line-through;color:var(--done)}
.del{background:none;border:0;color:var(--mute);font-size:22px;cursor:pointer;padding:6px 10px;border-radius:8px}
.del:hover{color:var(--ink)}
.add{display:flex;gap:10px;margin-top:22px}
.add input{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button.btn{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--mute);border:1px solid var(--line);margin-top:14px}
.all{display:none;margin-top:16px;padding:14px;border-radius:12px;background:var(--gold);color:#1d1500;font-weight:700;text-align:center}
</style>
</head>
<body>
<main>
<h1>Event To-Do List</h1>
<p class="sub">Tap an item to tick it when it’s done.</p>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="count"><span id="n">0 of 0 done</span><span id="pct">0%</span></div>
<ul id="list"></ul>
<div class="all" id="all">Everything is ready. Well done!</div>
<form class="add" id="f" onsubmit="return false">
<input id="t" placeholder="Add another task" autocomplete="off">
<button class="btn" id="b" type="button">Add</button>
</form>
<button class="btn ghost" id="r" type="button">Untick all</button>
</main>
<script>
var KEY="event-todo-v1";
var DEFAULT=["Check Chairs","Check Tables","Check Podium Decorations","Wall Lights & Sounds","Oil Lamp Matches & Mal Malaya","Table Clothes"];
var items=DEFAULT.map(function(t,i){return{id:i+1,t:t,d:false}});
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p))items=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function esc(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(){
var ul=document.getElementById("list");ul.innerHTML="";
items.forEach(function(it,i){
var li=document.createElement("li");if(it.d)li.className="done";
li.innerHTML='<label><input type="checkbox"'+(it.d?" checked":"")+'><span class="box">✓</span><span class="txt">'+(i+1)+". "+esc(it.t)+'</span></label><button class="del" aria-label="Remove">×</button>';
li.querySelector("input").onchange=function(e){it.d=e.target.checked;save();render()};
li.querySelector(".del").onclick=function(){items=items.filter(function(x){return x!==it});save();render()};
ul.appendChild(li)});
var d=items.filter(function(x){return x.d}).length,n=items.length,pc=n?Math.round(d/n*100):0;
document.getElementById("n").textContent=d+" of "+n+" done";
document.getElementById("pct").textContent=pc+"%";
document.getElementById("fill").style.width=pc+"%";
document.getElementById("all").style.display=(n&&d===n)?"block":"none"}
function add(){var i=document.getElementById("t"),v=i.value.trim();if(!v)return;items.push({id:Date.now(),t:v,d:false});i.value="";save();render()}
document.getElementById("b").onclick=add;
document.getElementById("t").onkeydown=function(e){if(e.key==="Enter")add()};
document.getElementById("r").onclick=function(){items.forEach(function(x){x.d=false});save();render()};
render();
</script>
</body>
</html>
